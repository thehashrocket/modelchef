<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orbit Board</title>
<meta name="description" content="A mock dish from gemini-flash that counts clicks.">
<style>
  body{font-family:system-ui;margin:0;min-height:100vh;display:grid;place-items:center;background:hsl(144 40% 14%);color:#fff}
  main{text-align:center;padding:2rem}
  button{font-size:1.25rem;padding:.75rem 1.5rem;border:0;border-radius:.5rem;background:hsl(144 80% 60%);cursor:pointer}
</style>
</head>
<body>
<main><h1>Orbit Board</h1><p>Clicks: <span id="n">0</span></p><button id="b">Click</button></main>
<script>
  let n=0; document.getElementById('b').onclick=()=>{document.getElementById('n').textContent=++n};
  
</script>
</body>
</html>
