<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry Planner</title>
<meta name="description" content="A simple pantry inventory web app for home cooks to track ingredients.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  body{
    margin:0;
    font-family:system-ui,sans-serif;
    background:#f9f9f9;
    color:#333;
    display:flex;
    justify-content:center;
    padding:1rem;
    box-sizing:border-box;
  }
  #app{
    max-width:420px;
    width:100%;
    background:#fff;
    border-radius:8px;
    box-shadow:0 2px 6px rgba(0,0,0,.1);
    padding:1rem;
    box-sizing:border-box;
  }
  h1{
    margin:0 0 .5rem;
    font-size:1.4rem;
    text-align:center;
  }
  #list{
    list-style:none;
    padding:0;
    margin:0 0 1rem;
  }
  #list li{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:.4rem .2rem;
    border-bottom:1px solid #eee;
  }
  #list li:last-child{border-bottom:none;}
  button{
    background:#ff6b6b;
    border:none;
    color:#fff;
    padding:.3rem .6rem;
    border-radius:4px;
    cursor:pointer;
    font-size:.9rem;
  }
  button.edit{
    background:#4ecca3;
  }
  form{
    display:flex;
    gap:.4rem;
  }
  input[type="text"]{
    flex:1;
    padding:.4rem;
    border:1px solid #ccc;
    border-radius:4px;
    font-size:1rem;
  }
  @media (max-width:390px){
    body{padding:.5rem;}
    h1{font-size:1.2rem;}
  }
</style>
</head>
<body>
<div id="app">
  <h1>Pantry Planner</h1>
  <ul id="list"></ul>
  <form id="addForm">
    <input type="text" id="newItem" placeholder="Add ingredient" autocomplete="off" required>
    <button type="submit">Add</button>
  </form>
</div>

<script>
(() => {
  const STORAGE_KEY = 'pantryPlannerData';
  let pantry = [];

  // Safe storage wrapper
  const storage = {
    get() {
      try {
        const data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : null;
      } catch (e) {
        return null;
      }
    },
    set(arr) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(arr));
      } catch (e) {
        // ignore – fallback to memory only
      }
    }
  };

  const defaultData = [
    'Olive oil',
    'All‑purpose flour',
    'Brown sugar',
    'Canned tomatoes',
    'Rice',
    'Eggs'
  ];

  function loadData() {
    const stored = storage.get();
    pantry = stored && Array.isArray(stored) ? stored : defaultData.slice();
  }

  function saveData() {
    storage.set(pantry);
  }

  function render() {
    const list = document.getElementById('list');
    list.innerHTML = '';
    pantry.forEach((item, idx) => {
      const li = document.createElement('li');

      const span = document.createElement('span');
      span.textContent = item;
      li.appendChild(span);

      const controls = document.createElement('div');

      const editBtn = document.createElement('button');
      editBtn.textContent = 'Edit';
      editBtn.className = 'edit';
      editBtn.onclick = () => editItem(idx);
      controls.appendChild(editBtn);

      const delBtn = document.createElement('button');
      delBtn.textContent = 'Del';
      delBtn.onclick = () => deleteItem(idx);
      controls.appendChild(delBtn);

      li.appendChild(controls);
      list.appendChild(li);
    });
  }

  function addItem(name) {
    if (!name) return;
    pantry.push(name);
    saveData();
    render();
  }

  function deleteItem(index) {
    pantry.splice(index, 1);
    saveData();
    render();
  }

  function editItem(index) {
    const current = pantry[index];
    const newName = prompt('Edit ingredient:', current);
    if (newName !== null && newName.trim() !== '') {
      pantry[index] = newName.trim();
      saveData();
      render();
    }
  }

  document.getElementById('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const input = document.getElementById('newItem');
    addItem(input.value.trim());
    input.value = '';
  });

  // Initialize
  loadData();
  render();
})();
</script>
</body>
</html>
