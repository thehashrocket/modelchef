<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Palette Builder</title>
<meta name="description" content="A simple colour palette builder that creates five harmonious colours from a base colour, showing hex and HSL and allowing copy.">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:sans-serif;margin:0;padding:1rem;background:#f5f5f5;display:flex;flex-direction:column;align-items:center;gap:1rem;}
h1{font-size:1.5rem;margin:0;}
#picker{width:100%;max-width:320px;height:40px;border:none;cursor:pointer;}
#palette{display:flex;flex-wrap:wrap;gap:0.5rem;justify-content:center;width:100%;max-width:350px;}
.swatch{flex:1 1 calc(50% - 0.5rem);min-width:120px;height:80px;border-radius:8px;color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:0.5rem;box-sizing:border-box;cursor:pointer;position:relative;}
.swatch::after{content:"Copy";position:absolute;bottom:4px;right:6px;background:rgba(0,0,0,0.3);padding:2px 4px;border-radius:4px;font-size:0.7rem;}
@media (max-width:390px){
  .swatch{flex:1 1 100%;}
}
</style>
</head>
<body>
<h1>Palette Builder</h1>
<input type="color" id="picker" value="#ff5722" aria-label="Pick base colour">
<div id="palette"></div>
<script>
(function(){
  const picker=document.getElementById('picker');
  const paletteDiv=document.getElementById('palette');
  const storageKey='palette-base';
  function saveBase(col){
    try{localStorage.setItem(storageKey,col);}catch(e){}
  }
  function loadBase(){
    try{return localStorage.getItem(storageKey);}catch(e){return null;}
  }
  function hexToHSL(hex){
    let r=parseInt(hex.slice(1,3),16)/255;
    let g=parseInt(hex.slice(3,5),16)/255;
    let b=parseInt(hex.slice(5,7),16)/255;
    let max=Math.max(r,g,b), min=Math.min(r,g,b);
    let h, s, l=(max+min)/2;
    if(max===min){h=0;s=0;}
    else{
      let d=max-min;
      s=l>0.5?d/(2-max-min):d/(max+min);
      switch(max){
        case r:h=(g-b)/d+(g<b?6:0);break;
        case g:h=(b-r)/d+2;break;
        case b:h=(r-g)/d+4;break;
      }
      h=Math.round(h*60);
    }
    s=Math.round(s*100);
    l=Math.round(l*100);
    return {h,s,l};
  }
  function hslToHex(h,s,l){
    s/=100; l/=100;
    const k=n=> (n + h/30) % 12;
    const a = s*Math.min(l,1-l);
    const f=n=> l - a * Math.max(-1, Math.min(k(n)-3, Math.min(9-k(n),1)));
    const r=Math.round(255*f(0));
    const g=Math.round(255*f(8));
    const b=Math.round(255*f(4));
    return "#" + [r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  function generatePalette(baseHex){
    const baseHSL=hexToHSL(baseHex);
    const offsets=[0,30,60,-30,-60];
    return offsets.map(off=>{
      let h=(baseHSL.h+off)%360;
      if(h<0)h+=360;
      return hslToHex(h,baseHSL.s,baseHSL.l);
    });
  }
  function render(){
    const base=picker.value;
    const colors=generatePalette(base);
    paletteDiv.innerHTML='';
    colors.forEach(c=>{
      const hsl=hexToHSL(c);
      const sw=document.createElement('div');
      sw.className='swatch';
      sw.style.backgroundColor=c;
      sw.innerHTML=`<div>${c}</div><div>hsl(${hsl.h},${hsl.s}%,${hsl.l}%)</div>`;
      sw.addEventListener('click',()=>{copy(c);});
      paletteDiv.appendChild(sw);
    });
  }
  function copy(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).catch(()=>{fallbackCopy(text);});
    }else{
      fallbackCopy(text);
    }
  }
  function fallbackCopy(text){
    const el=document.createElement('textarea');
    el.value=text;
    el.style.position='fixed';
    el.style.left='-9999px';
    document.body.appendChild(el);
    el.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(el);
    alert('Copied '+text);
  }
  picker.addEventListener('input',()=>{render();saveBase(picker.value);});
  const saved=loadBase();
  if(saved){picker.value=saved;}
  render();
})();
</script>
</body>
</html>
