<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown Previewer</title>
<meta name="description" content="A split-pane markdown editor with live preview and word count, for writers and developers who want instant feedback.">
<style>
:root {
  --bg: #0d1117;
  --panel: #161b22;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent-hover: #79b8ff;
  --code-bg: #0d1117;
  --select: #264f78;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); font-size: 16px; line-height: 1.5; overflow: hidden; }
header { display: flex; align-items: center; justify-content: space-between; padding: 0.75rem 1rem; background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; gap: 1rem; }
header h1 { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.word-count { font-size: 0.8rem; color: var(--muted); background: var(--bg); padding: 0.25rem 0.6rem; border-radius: 4px; border: 1px solid var(--border); white-space: nowrap; font-variant-numeric: tabular-nums; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
main { display: grid; grid-template-columns: 1fr 1fr; height: calc(100vh - 48px); overflow: hidden; }
.pane { display: flex; flex-direction: column; min-width: 0; }
.pane-label { padding: 0.5rem 1rem; font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); background: var(--panel); border-bottom: 1px solid var(--border); flex-shrink: 0; }
.editor-wrap { flex: 1; overflow: hidden; position: relative; }
#editor { width: 100%; height: 100%; border: none; outline: none; resize: none; background: var(--bg); color: var(--text); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 14px; line-height: 1.6; padding: 1rem; tab-size: 2; }
#editor::placeholder { color: var(--muted); opacity: 0.6; }
#editor::selection { background: var(--select); }
.preview-wrap { flex: 1; overflow: auto; background: var(--bg); }
#preview { padding: 1rem; max-width: 100%; }
#preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 { margin: 1.2em 0 0.4em; font-weight: 600; line-height: 1.3; color: var(--text); }
#preview h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#preview h2 { font-size: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 0.3em; }
#preview h3 { font-size: 1.25rem; }
#preview h4 { font-size: 1.1rem; }
#preview p { margin: 0.8em 0; }
#preview ul, #preview ol { margin: 0.8em 0; padding-left: 1.5rem; }
#preview li { margin: 0.3em 0; }
#preview li::marker { color: var(--muted); }
#preview a { color: var(--accent); text-decoration: none; }
#preview a:hover { text-decoration: underline; color: var(--accent-hover); }
#preview code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 0.9em; background: var(--code-bg); padding: 0.15em 0.4em; border-radius: 4px; border: 1px solid var(--border); }
#preview pre { margin: 1em 0; border-radius: 8px; overflow: auto; border: 1px solid var(--border); background: var(--code-bg); }
#preview pre code { display: block; padding: 1rem; background: transparent; border: none; border-radius: 0; font-size: 13px; line-height: 1.55; white-space: pre; overflow-x: auto; }
#preview blockquote { margin: 1em 0; padding: 0.5em 1em; border-left: 3px solid var(--accent); background: rgba(88, 166, 255, 0.08); border-radius: 0 8px 8px 0; color: var(--muted); font-style: italic; }
#preview hr { border: none; border-top: 1px solid var(--border); margin: 1.5em 0; }
#preview table { border-collapse: collapse; width: 100%; max-width: 100%; overflow-x: auto; display: block; margin: 1em 0; }
#preview th, #preview td { border: 1px solid var(--border); padding: 0.5rem 0.75rem; text-align: left; }
#preview th { background: var(--panel); font-weight: 600; }
#preview img { max-width: 100%; height: auto; border-radius: 6px; border: 1px solid var(--border); }
#preview strong { font-weight: 600; }
#preview em { font-style: italic; }
#preview del { text-decoration: line-through; color: var(--muted); }
@media (max-width: 640px) {
  main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
  .pane { min-height: 0; }
  header { padding: 0.5rem; }
  header h1 { font-size: 1rem; }
  .word-count { font-size: 0.7rem; padding: 0.2rem 0.5rem; }
  #editor { font-size: 13px; padding: 0.75rem; }
  #preview { padding: 0.75rem; }
  #preview h1 { font-size: 1.5rem; }
  #preview h2 { font-size: 1.3rem; }
  #preview pre code { font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<header>
  <h1>Markdown Previewer</h1>
  <div class="word-count" id="wc">0 words</div>
</header>
<main>
  <section class="pane">
    <div class="pane-label">Editor</div>
    <div class="editor-wrap">
      <textarea id="editor" spellcheck="false" placeholder="Type markdown here…"></textarea>
    </div>
  </section>
  <section class="pane">
    <div class="pane-label">Preview</div>
    <div class="preview-wrap" id="preview"></div>
  </section>
</main>
<script>
(() => {
  const editor = document.getElementById('editor');
  const preview = document.getElementById('preview');
  const wc = document.getElementById('wc');

  const demo = `# Welcome to Markdown Previewer

A **split-pane** editor with *live rendering* and word count.

## Features

- Headings (H1–H6)
- **Bold** and *italic* text
- \`Inline code\` and code blocks
- Links: [GitHub](https://github.com)
- Lists (ordered & unordered)
- Blockquotes
- Tables
- Horizontal rules

### Code Example

\`\`\`js
function greet(name) {
  return \`Hello, \${name}!\`;
}
console.log(greet('World'));
\`\`\`

### A Table

| Feature | Supported |
|---------|-----------|
| Headings | ✓ |
| Lists | ✓ |
| Code | ✓ |
| Tables | ✓ |

> “Good code is its own best documentation.”
> — Steve McConnell

---

Start typing to see the preview update instantly.`;

  function countWords(str) {
    return str.trim() ? str.trim().split(/\s+/).length : 0;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function parseInline(text) {
    return text
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
      .replace(/\*([^*]+)\*/g, '<em>$1</em>')
      .replace(/~~([^~]+)~~/g, '<del>$1</del>')
      .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }

  function parseMarkdown(md) {
    const lines = md.split('\n');
    const html = [];
    let inCode = false;
    let codeLang = '';
    let codeBuffer = [];
    let inList = false;
    let listType = '';
    let listBuffer = [];

    function flushCode() {
      if (codeBuffer.length) {
        const code = escapeHtml(codeBuffer.join('\n'));
        html.push('<pre><code>' + code + '</code></pre>');
        codeBuffer = [];
      }
      inCode = false;
      codeLang = '';
    }

    function flushList() {
      if (listBuffer.length) {
        const tag = listType === 'ol' ? 'ol' : 'ul';
        html.push('<' + tag + '>' + listBuffer.join('') + '</' + tag + '>');
        listBuffer = [];
      }
      inList = false;
      listType = '';
    }

    for (let i = 0; i < lines.length; i++) {
      let line = lines[i];

      if (inCode) {
        if (line.startsWith('```')) {
          flushCode();
        } else {
          codeBuffer.push(line);
        }
        continue;
      }

      if (line.startsWith('```')) {
        flushList();
        inCode = true;
        codeLang = line.slice(3).trim();
        continue;
      }

      const hrMatch = line.match(/^(\s*)([-*_])\s*(\2\s*){2,}$/);
      if (hrMatch) {
        flushList();
        html.push('<hr>');
        continue;
      }

      const hMatch = line.match(/^(#{1,6})\s+(.*)/);
      if (hMatch) {
        flushList();
        const level = hMatch[1].length;
        const content = parseInline(hMatch[2].trim());
        html.push('<h' + level + '>' + content + '</h' + level + '>');
        continue;
      }

      const blockquoteMatch = line.match(/^>\s?(.*)/);
      if (blockquoteMatch) {
        flushList();
        let quoteLines = [blockquoteMatch[1]];
        let j = i + 1;
        while (j < lines.length && lines[j].match(/^>\s?/)) {
          quoteLines.push(lines[j].replace(/^>\s?/, ''));
          j++;
        }
        i = j - 1;
        const content = parseInline(quoteLines.join(' ').trim());
        html.push('<blockquote>' + content + '</blockquote>');
        continue;
      }

      const olMatch = line.match(/^(\s*)(\d+)\.\s+(.*)/);
      const ulMatch = line.match(/^(\s*)[-*+]\s+(.*)/);
      if (olMatch || ulMatch) {
        const match = olMatch || ulMatch;
        const indent = match[1].length;
        const content = parseInline(match[3]);
        if (!inList) {
          inList = true;
          listType = olMatch ? 'ol' : 'ul';
        } else if ((olMatch && listType !== 'ol') || (ulMatch && listType !== 'ul')) {
          flushList();
          inList = true;
          listType = olMatch ? 'ol' : 'ul';
        }
        listBuffer.push('<li>' + content + '</li>');
        continue;
      } else if (inList && line.trim() === '') {
        continue;
      } else if (inList) {
        flushList();
      }

      const tableMatch = line.match(/^\s*\|(.+)\|\s*$/);
      if (tableMatch) {
        flushList();
        const rows = [];
        let k = i;
        while (k < lines.length && lines[k].match(/^\s*\|(.+)\|\s*$/)) {
          rows.push(lines[k]);
          k++;
        }
        i = k - 1;
        const cells = rows[0].split('|').slice(1, -1).map(c => c.trim());
        const isHeaderSep = rows[1] && rows[1].match(/^\s*\|[\s\-\|:]+\|\s*$/);
        let tableHtml = '<table>';
        if (isHeaderSep) {
          tableHtml += '<thead><tr>';
          cells.forEach(c => tableHtml += '<th>' + parseInline(c) + '</th>');
          tableHtml += '</tr></thead><tbody>';
          for (let r = 2; r < rows.length; r++) {
            const rowCells = rows[r].split('|').slice(1, -1).map(c => c.trim());
            tableHtml += '<tr>';
            rowCells.forEach(c => tableHtml += '<td>' + parseInline(c) + '</td>');
            tableHtml += '</tr>';
          }
        } else {
          tableHtml += '<tbody>';
          rows.forEach(row => {
            const rowCells = row.split('|').slice(1, -1).map(c => c.trim());
            tableHtml += '<tr>';
            rowCells.forEach(c => tableHtml += '<td>' + parseInline(c) + '</td>');
            tableHtml += '</tr>';
          });
        }
        tableHtml += '</tbody></table>';
        html.push(tableHtml);
        continue;
      }

      if (line.trim() === '') {
        html.push('<p></p>');
        continue;
      }

      let paragraph = [line];
      let m = i + 1;
      while (m < lines.length && lines[m].trim() !== '' && !lines[m].match(/^(#{1,6}\s|>\s|```|[-*+]\s|\d+\.\s|\s*\|.*\|\s*$|(\s*)([-*_])\s*(\2\s*){2,}$)/)) {
        paragraph.push(lines[m]);
        m++;
      }
      i = m - 1;
      const content = parseInline(paragraph.join(' ').trim());
      if (content) html.push('<p>' + content + '</p>');
    }

    flushCode();
    flushList();
    return html.join('\n');
  }

  function render() {
    const val = editor.value;
    preview.innerHTML = parseMarkdown(val);
    wc.textContent = countWords(val) + ' word' + (countWords(val) !== 1 ? 's' : '');
  }

  let stored = '';
  try { stored = localStorage.getItem('md_content') || ''; } catch (_) {}
  editor.value = stored || demo;

  let pending = false;
  editor.addEventListener('input', () => {
    if (!pending) {
      pending = true;
      requestAnimationFrame(() => {
        render();
        pending = false;
        try { localStorage.setItem('md_content', editor.value); } catch (_) {}
      });
    }
  });

  editor.addEventListener('keydown', (e) => {
    if (e.key === 'Tab') {
      e.preventDefault();
      const start = editor.selectionStart;
      const end = editor.selectionEnd;
      editor.value = editor.value.substring(0, start) + '  ' + editor.value.substring(end);
      editor.selectionStart = editor.selectionEnd = start + 2;
      render();
      try { localStorage.setItem('md_content', editor.value); } catch (_) {}
    }
  });

  render();
})();
</script>
</body>
</html>
